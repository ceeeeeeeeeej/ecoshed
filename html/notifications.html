<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Center - EcoSched Admin</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/notifications.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="page-container">

        <div class="sticky-header-wrapper">
            <!-- Page Header -->
            <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0; flex-wrap: wrap; gap: 1rem;">
                <div class="header-left">
                    <h1 class="page-title" style="font-size: 1.5rem; font-weight: 700; color: #111827; display: flex; align-items: center; gap: 0.75rem; margin: 0;">
                        <i class="fas fa-bell" style="color: #10b981;"></i>
                        Notification Center
                    </h1>
                    <p class="page-subtitle" style="font-size: 0.875rem; color: #6b7280; margin: 0.375rem 0 0;">Stay updated with system alerts and activities</p>
                </div>
                <div class="header-right">
                    <button class="btn btn-secondary" onclick="window.clearAllNotifications()" style="display: flex; align-items: center; gap: 8px; background: white; color: #dc2626; border: 1px solid #dc2626; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;">
                        <i class="fas fa-trash-alt"></i> Clear All
                    </button>
                </div>
            </div>
        </div>

        <!-- Notification Stats -->
        <div class="notification-stats">
            <div class="stat-item" onclick="window.filterNotifications('all')" style="cursor: pointer;">
                <div class="stat-icon unread">
                    <i class="fas fa-bell"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">Total</div>
                </div>
            </div>
            <div class="stat-item" onclick="window.filterNotifications('unread')" style="cursor: pointer;">
                <div class="stat-icon urgent">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-number" id="unreadCount">0</div>
                    <div class="stat-label">Unread</div>
                </div>
            </div>
            <div class="stat-item" onclick="window.filterNotifications('today')" style="cursor: pointer;">
                <div class="stat-icon today">
                    <i class="fas fa-calendar-day"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-number" id="todayCount">0</div>
                    <div class="stat-label">Today</div>
                </div>
            </div>
        </div>

        <div class="notifications-container">
            <div class="notifications-list" id="notificationsList">
                <!-- Notifications will be loaded here -->
            </div>
        </div>

        <!-- Notification Settings Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Notification Settings</h3>
                    <button class="modal-close" onclick="closeSettingsModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="settings-section">
                        <h4>Email Notifications</h4>
                        <div class="setting-item">
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                            <span>System alerts</span>
                        </div>
                        <div class="setting-item">
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                            <span>Route updates</span>
                        </div>
                        <div class="setting-item">
                            <label class="switch">
                                <input type="checkbox">
                                <span class="slider"></span>
                            </label>
                            <span>Daily reports</span>
                        </div>
                    </div>
                    <div class="settings-section">
                        <h4>Push Notifications</h4>
                        <div class="setting-item">
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                            <span>Urgent alerts</span>
                        </div>
                        <div class="setting-item">
                            <label class="switch">
                                <input type="checkbox">
                                <span class="slider"></span>
                            </label>
                            <span>IoT sensor alerts</span>
                        </div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeSettingsModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/pages/notifications.js"></script>
</body>

</html>
