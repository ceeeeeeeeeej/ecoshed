<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSched Emergency Admin Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: var(--card);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 20px;
        }
        h1 { margin: 0 0 10px; font-size: 24px; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary); outline: none; }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-dark); }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .success { background: #d1fae5; color: #065f46; display: block !important; }
        .error { background: #fee2e2; color: #991b1b; display: block !important; }
        .loading { font-style: italic; color: #6b7280; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-shield-alt"></i></div>
        <h1>Emergency Admin Setup</h1>
        <p>Use this tool to forcefully activate an existing Supabase user as a <b>Super Admin</b>. 
        <br><br><i>Warning: Delete this file from your server after use.</i></p>
        
        <div class="input-group">
            <label>Admin User Email</label>
            <input type="email" id="email" placeholder="e.g., admin@example.com">
        </div>
        
        <button id="fixBtn">Fix My Account & Make SuperAdmin</button>
        
        <div id="status"></div>
        <div id="loader" class="loading" style="display:none;">Connecting to Supabase...</div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // These credentials are taken from your supabase_config.js
        const SUPABASE_URL = 'https://bfqktqtsjchbmopafgzf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcWt0cXRzamNoYm1vcGFmZ3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyMDgwMTIsImV4cCI6MjA4NTc4NDAxMn0.Xu7Ncwr5bWYF8x2t5h7XHw_nPrjlTSkQEdnQB4OtcNo';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const fixBtn = document.getElementById('fixBtn');
        const emailInput = document.getElementById('email');
        const statusDiv = document.getElementById('status');
        const loader = document.getElementById('loader');

        fixBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email) {
                showStatus('Please enter an email address.', 'error');
                return;
            }

            setLoading(true);
            try {
                // 1. Find user in the public.users table
                const { data: users, error: findError } = await supabase
                    .from('users')
                    .select('id, email')
                    .eq('email', email);

                if (findError) throw findError;

                if (!users || users.length === 0) {
                    showStatus('User not found in the "users" table. Did you register already?', 'error');
                    return;
                }

                const user = users[0];

                // 2. Explictly update status and role
                const { error: updateError } = await supabase
                    .from('users')
                    .update({
                        status: 'active',
                        role: 'superadmin',
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', user.id);

                if (updateError) throw updateError;

                showStatus(`Success! Account [${user.email}] is now an ACTIVE SUPERADMIN. You can now log in.`, 'success');
                fixBtn.textContent = 'Fix Complete!';
                fixBtn.disabled = true;

            } catch (err) {
                console.error(err);
                showStatus('Error: ' + (err.message || JSON.stringify(err)), 'error');
            } finally {
                setLoading(false);
            }
        });

        function showStatus(msg, type) {
            statusDiv.textContent = msg;
            statusDiv.className = type;
        }

        function setLoading(val) {
            loader.style.display = val ? 'block' : 'none';
            fixBtn.disabled = val;
        }
    </script>
</body>
</html>
