<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin Locations Map - EcoSched Admin</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/pages/bin-locations.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>

<body>
    <div class="page-container">
        <div class="sticky-header-wrapper">
            <div class="page-header">
                <div class="header-left">
                    <h1 class="page-title">
                        <i class="fas fa-map-marked-alt"></i>
                        Bin Locations
                    </h1>
                    <p class="page-subtitle">Manage and monitor physical bin placements across the service area</p>
                </div>
            </div>
        </div>

        <div class="content-grid">
            <!-- Map View -->
            <div class="map-section">
                <div class="section-header">
                    <div>
                        <h2>Map Editor</h2>
                        <p>Drag the pins to update the bin's physical location.</p>
                    </div>
                    <button id="saveLocationsBtn" class="btn btn-primary" style="opacity: 0.5; pointer-events: none;">
                        <i class="fas fa-save" style="margin-right: 6px;"></i> Save Changes
                    </button>
                </div>
                <div id="locationMap"></div>
            </div>

            <!-- Bins Sidebar View -->
            <div class="list-section">
                <div class="filter-section">
                    <div class="search-container">
                        <i class="fas fa-search"></i>
                        <input type="text" id="binSearchInput" class="form-input" placeholder="Search bins by ID or area...">
                    </div>
                    <select id="zoneFilter" class="form-select">
                        <option value="all">All Barangays</option>
                        <option value="victoria">Victoria</option>
                        <option value="dayo-an">Dayo-an</option>
                    </select>
                </div>
                <div class="bin-list" id="binListContainer">
                    <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p style="margin-top: 12px;">Loading bins...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Page Logic -->
    <script type="module" src="./js/pages/bin-locations.js?v=3"></script>
</body>

</html>
